
services:
  postgres:
    image: postgres:17
    container_name: jobqueue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobqueue
      POSTGRES_PASSWORD: jobqueue_dev
      POSTGRES_DB: jobqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

